name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
  e2e:
    name: generated specs pass under Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run e2e
      - run: npm run e2e:js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            .e2e/results.json
            .e2e/results.csv
            .e2e/tests
